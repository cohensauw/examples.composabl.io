[project]
name = "T Rolling Mean"
version = "0.1.0"
description = "ML thermal runaway predictor"
authors = [{ name = "John Doe", email = "john.doe@composabl.com" }]
dependencies = [
    "composabl-core",
    "numpy"
]

[composabl]
type = "perceptor"
entrypoint = "dummy_predictor.perceptor:ThermalRunawayPredict"

# Include additional data files
[tool.setuptools.packages.find]
where = ["dummy_predictor"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.pkl"]
